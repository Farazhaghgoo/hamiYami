<!doctype html>
<!--
  Source for public/assets/images/og-image.png (1200×630 social sharing image).
  Re-render after edits with: npm run og-image   (needs Microsoft Edge or Chrome installed)
-->
<html lang="it">
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: "Fraunces"; src: url("../src/app/fonts/fraunces-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
    @font-face { font-family: "Figtree"; src: url("../src/app/fonts/figtree-latin-wght-normal.woff2") format("woff2"); font-weight: 300 900; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      display: grid;
      grid-template-columns: 1fr 440px;
      background: #FFF8EF;
      color: #28251F;
      font-family: "Figtree", sans-serif;
    }
    .copy { display: flex; flex-direction: column; justify-content: center; padding: 0 36px 0 80px; }
    .wordmark { display: block; align-self: flex-start; width: auto; height: 84px; }
    h1 { margin: 44px 0 0; font-family: "Fraunces", serif; font-weight: 650; font-size: 62px; line-height: 1; letter-spacing: -0.035em; }
    h1 span { color: #BA392B; }
    p { margin: 34px 0 0; font-size: 28px; color: #5E574C; }
    .media { position: relative; }
    .media img { position: absolute; inset: 40px 40px 40px 0; width: calc(100% - 40px); height: calc(100% - 80px); object-fit: cover; border-radius: 32px; }
  </style>
</head>
<body>
  <div class="copy">
    <img class="wordmark" src="../public/assets/brand/hamiyami-wordmark.svg" alt="">
    <h1>La tua prossima cena,<br><span>cucinata vicino a te.</span></h1>
    <p>Demo di un marketplace in progetto per i pasti del quartiere.</p>
  </div>
  <div class="media"><img src="../public/assets/images/lasagna-800.webp" alt=""></div>
</body>
</html>
